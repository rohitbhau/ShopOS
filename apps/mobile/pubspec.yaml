name: shopos
description: Low-code platform for small shops in India
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # Routing
  go_router: ^13.0.0
  
  # Backend
  supabase_flutter: ^2.3.0
  
  # Local Database
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  sqflite_sqlcipher: ^2.2.0
  path_provider: ^2.1.0
  path: ^1.8.3
  
  # Network & Connectivity
  connectivity_plus: ^5.0.0
  http: ^1.1.0
  
  # Barcode Scanning
  mobile_scanner: ^4.0.0
  
  # PDF & Printing
  pdf: ^3.10.0
  printing: ^5.11.0
  intl: ^0.20.2
  
  # Utilities
  url_launcher: ^6.2.0
  share_plus: ^7.2.0
  image_picker: ^1.0.0
  file_picker: ^8.3.7
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.0
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  uuid: ^4.2.0
  collection: ^1.18.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  logger: ^2.0.0
  permission_handler: ^11.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.0
  drift_dev: ^2.14.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  
  # Testing
  mocktail: ^1.0.0
  
  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - ../../packages/supabase/seed/

  # Localization
  generate: true

flutter_gen:
  output: lib/gen/
  line_length: 80
